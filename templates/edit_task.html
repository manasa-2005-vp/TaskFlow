<!DOCTYPE html>
<html>
<head>
    <title>Edit Task - TaskFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">TaskFlow</a>

        <a href="/dashboard" class="btn btn-light">
            Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="mb-4">Edit Task</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label>Task Title</label>

                        <input type="text"
                               name="title"
                               value="{{ task.title }}"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Description</label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="3">{{ task.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label>Priority</label>

                        <select name="priority" class="form-select">

                            <option value="Low"
                                {% if task.priority == 'Low' %}selected{% endif %}>
                                Low
                            </option>

                            <option value="Medium"
                                {% if task.priority == 'Medium' %}selected{% endif %}>
                                Medium
                            </option>

                            <option value="High"
                                {% if task.priority == 'High' %}selected{% endif %}>
                                High
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Status</label>

                        <select name="status" class="form-select">

                            <option value="Pending"
                                {% if task.status == 'Pending' %}selected{% endif %}>
                                Pending
                            </option>

                            <option value="In Progress"
                                {% if task.status == 'In Progress' %}selected{% endif %}>
                                In Progress
                            </option>

                            <option value="Completed"
                                {% if task.status == 'Completed' %}selected{% endif %}>
                                Completed
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Due Date</label>

                        <input type="date"
                               name="due_date"
                               value="{{ task.due_date }}"
                               class="form-control">
                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        Update Task
                    </button>

                    <a href="/dashboard"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>
    </div>

</div>

</body>
</html>
